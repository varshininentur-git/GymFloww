# Activate with SPRING_PROFILES_ACTIVE=prod on the hosted backend.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
gym.cors.allowed-origins=${GYM_CORS_ALLOWED_ORIGINS:https://gymflow-frontend-pied.vercel.app}
# Spring MVC can log serialized response bodies at DEBUG, including the CSRF bootstrap token.
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
